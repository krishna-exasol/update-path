name: pkg / json-tables

# JSON Tables (exasol-labs/exasol-json-tables) is a Python package plus a Rust
# ingest engine (crate `json_to_parquet`). We cross-build the engine for every
# distribution ONCE here and publish the binaries + wheel to our
# `mirror-json-tables` release, so end users never need Rust/cargo — the app
# just downloads the prebuilt artifact. Change-gated on the upstream commit.

on:
  schedule:
    - cron: "30 7 * * *" # daily 07:30 UTC (the check job is change-gated)
  workflow_dispatch:

concurrency:
  group: pkg-json-tables
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

env:
  UPSTREAM: exasol-labs/exasol-json-tables

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.v.outputs.sha }}
      ref: ${{ steps.v.outputs.ref }}
      changed: ${{ steps.v.outputs.changed }}
    steps:
      - id: v
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # ONLY a released version is ever built or advertised. "v0.1" is
          # something a user can recognise, compare and talk about; a bare
          # commit id like 41ddd51a9a33 is not, and it silently ties every
          # install to whatever main happened to hold that day.
          #
          # Two things count as a release, in order:
          #   1. a published GitHub Release  (/releases/latest -> tag_name)
          #   2. a plain git TAG             (/tags -> newest by commit date)
          #
          # The tag step matters because /releases/latest sees ONLY published
          # Releases: a repository that ran `git tag v0.1 && git push --tags`
          # without cutting a Release looks release-less to that endpoint, and
          # that is exactly why builds used to be advertised as a commit id.
          #
          # There is deliberately NO fallback to the main commit. If upstream
          # has cut nothing, this builds nothing and says so - an unreleased
          # main is not a version, and shipping one as if it were is how a
          # user ends up pinned to an arbitrary mid-development tree.
          # Both lookups are non-fatal: `set -o pipefail` is on, so a blip in
          # curl or jq would otherwise abort the run rather than fall through
          # to the next source of a version.
          rel=$(curl -sSL -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$UPSTREAM/releases/latest" | jq -r '.tag_name // ""') || rel=""
          if [ -z "$rel" ] || [ "$rel" = "null" ]; then
            # Newest tag by the date of the commit it points at - NOT the order
            # the API happens to return, which is lexical and would make v0.10
            # older than v0.9.
            rel=$(curl -sSL -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/$UPSTREAM/tags?per_page=100" \
              | jq -r '.[] | "\(.name) \(.commit.url)"' \
              | while read -r name url; do
                  date=$(curl -sSL -H "Authorization: Bearer $GH_TOKEN" "$url" \
                    | jq -r '.commit.committer.date // ""')
                  [ -n "$date" ] && printf '%s\t%s\n' "$date" "$name"
                done | sort -r | head -1 | cut -f2) || rel=""
          fi
          if [ -z "$rel" ] || [ "$rel" = "null" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "sha=" >> "$GITHUB_OUTPUT"
            echo "ref=" >> "$GITHUB_OUTPUT"
            echo "::warning::$UPSTREAM has published no Release and no tag - nothing to build. Cut a release upstream, then re-run this workflow."
            exit 0
          fi
          # The tag is both what gets BUILT and what gets ADVERTISED, so the
          # artifacts and the version can never describe different code.
          sha="$rel"; ref="$rel"
          last=$(curl -sSL -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/mirror-json-tables" \
            | jq -r '.body // ""' | sed -n 's/.*version=\([^ ]*\).*/\1/p') || last=""
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          if [ -n "$sha" ] && [ "$sha" != "$last" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "::notice::json-tables $last -> $sha - building the prebuilt artifacts."
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::json-tables unchanged ($sha) - skipping."
          fi

  ingest:
    needs: check
    if: needs.check.outputs.changed == 'true'
    name: ingest ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        # macOS x86 (macos-13) dropped — that runner is the slow one. The rest
        # of the distributions stay.
        include:
          - { os: ubuntu-22.04, label: linux-x86_64, ext: "" }
          - { os: ubuntu-22.04-arm, label: linux-aarch64, ext: "" }
          - { os: macos-14, label: macos-aarch64, ext: "" }
          - { os: windows-latest, label: windows-x86_64, ext: ".exe" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: exasol-labs/exasol-json-tables
          ref: ${{ needs.check.outputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          key: ${{ matrix.label }}
      - name: Build ingest engine
        run: cargo build --release --manifest-path crates/json_tables_ingest/Cargo.toml --target-dir "${{ github.workspace }}/rust-target"
      - name: Stage binary
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p out
          bin="rust-target/release/json_to_parquet${{ matrix.ext }}"
          if [ ! -f "$bin" ]; then
            # Fall back: find the built executable anywhere under a release dir.
            bin=$(find . -type f -name "json_to_parquet${{ matrix.ext }}" -path "*/release/*" | head -n1)
          fi
          test -n "$bin" && test -f "$bin"
          cp "$bin" "out/exasol-json-tables-ingest-${{ matrix.label }}${{ matrix.ext }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ingest-${{ matrix.label }}
          path: out/*

  wheel:
    needs: check
    if: needs.check.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: exasol-labs/exasol-json-tables
          ref: ${{ needs.check.outputs.ref }}
      - uses: astral-sh/setup-uv@v5
      - name: Build wheel
        run: |
          set -euxo pipefail
          uv build --wheel || uv pip wheel . -w dist --no-deps
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/*.whl

  publish:
    needs: [check, ingest, wheel]
    if: needs.check.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Flatten
        run: |
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          ls -la release
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: mirror-json-tables
          name: json-tables (prebuilt by CI)
          body: |
            Prebuilt JSON Tables ingest engine (all distributions) + Python wheel,
            built once from ${{ env.UPSTREAM }} so users need no Rust/cargo.
            version=${{ needs.check.outputs.sha }}
          files: release/*
          prerelease: true

  advertise:
    # THE ORDERING GUARANTEE. versions.json is what every installed kit reads
    # to decide whether an update exists, so it must never name a json-tables
    # version whose prebuilt artifacts are not already downloadable. This job
    # runs only after publish succeeded, and it proposes the bump as a pull
    # request -- the same review and the same CI a hand-written bump gets.
    # Until it merges, users keep being offered the last version that really
    # is on the mirror. Nobody is ever shown an update they cannot install.
    needs: [check, publish]
    if: needs.check.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: point versions.json at the freshly published build
        id: bump
        run: |
          set -euo pipefail
          new="${{ needs.check.outputs.sha }}"
          python3 - "$new" <<'PY'
          import json, sys
          new = sys.argv[1]
          with open("versions.json") as handle:
              doc = json.load(handle)
          block = doc["components"]["json-tables"]
          old = block.get("version", "")
          if old == new:
              print("unchanged")
              raise SystemExit(0)
          block["version"] = new
          with open("versions.json", "w") as handle:
              json.dump(doc, handle, indent=2)
              handle.write("\n")
          print("bumped %s -> %s" % (old, new))
          PY
          # The module's fallback constant is what a no-network install picks:
          # it moves with the manifest or the two drift apart, which versions.yml
          # fails the build over.
          sed -i "s/^EXAKIT_JSON_TABLES_VERSION_FALLBACK=\"\${EXAKIT_JSON_TABLES_VERSION_FALLBACK:-.*}\"$/EXAKIT_JSON_TABLES_VERSION_FALLBACK=\"\${EXAKIT_JSON_TABLES_VERSION_FALLBACK:-$new}\"/" setup/lib/json-tables.sh
          python3 - "$new" <<'PY'
          import re, sys
          new = sys.argv[1]
          path = "setup/lib/json-tables.ps1"
          with open(path) as handle:
              text = handle.read()
          text = re.sub(r'(\$script:JsonTablesVersionFallback = .*else \{ ")[^"]*(" \})',
                        lambda m: m.group(1) + new + m.group(2), text, count=1)
          with open(path, "w") as handle:
              handle.write(text)
          PY
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: open the pull request
        if: steps.bump.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          new="${{ needs.check.outputs.sha }}"
          branch="pkg/json-tables-$new"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add versions.json setup/lib/json-tables.sh setup/lib/json-tables.ps1
          git commit -m "json-tables: advertise $new (prebuilt artifacts published)"
          git push -u origin "$branch" --force
          # An existing open PR for this branch just gets the new commit from
          # the push above; only create one when none is open. Never hide the
          # error: if creation is refused (most commonly the repository
          # setting "Allow GitHub Actions to create and approve pull
          # requests" being off), say exactly that and hand over the one-click
          # URL instead of failing a job whose artifacts are already published.
          if [ -n "$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty')" ]; then
            echo "::notice::an open PR for $branch already exists - the push updated it."
          elif gh pr create --head "$branch" --base "${{ github.event.repository.default_branch }}" \
            --title "json-tables: advertise $new" \
            --body "The prebuilt ingest engine and wheel for \`$new\` are on the \`mirror-json-tables\` release, so \`exakit update\` can now offer it. Merging this is what makes the new build visible to installed kits."; then
            echo "::notice::advertise PR opened for $new."
          else
            echo "::warning::could not open the advertise PR (is 'Allow GitHub Actions to create and approve pull requests' enabled under Settings > Actions > General?). The branch is pushed - open it here: https://github.com/${{ github.repository }}/compare/${{ github.event.repository.default_branch }}...$branch?expand=1"
          fi
